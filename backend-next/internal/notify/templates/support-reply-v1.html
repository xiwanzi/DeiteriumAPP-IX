<!doctype html>
<html lang="zh-CN" style="color-scheme:only light;">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light only">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>{{.Subject}}</title>
<style>
:root{color-scheme:only light!important;supported-color-schemes:light only}
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}table,td{mso-table-lspace:0;mso-table-rspace:0}table{border-collapse:collapse}img{border:0;outline:none;-ms-interpolation-mode:bicubic}
@media screen and (max-width:600px){.reply-pad{padding:32px 24px!important}}
</style>
</head>
<body bgcolor="#ffffff" style="margin:0;padding:0;background-color:#ffffff!important;background-image:linear-gradient(#ffffff,#ffffff)!important;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="background-color:#ffffff!important;background-image:linear-gradient(#ffffff,#ffffff)!important;"><tr><td align="center">
<!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;table-layout:fixed;font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;"><tr><td class="reply-pad" style="padding:44px 36px 32px;">
<div class="reply-body" style="margin:0;font-size:15px;line-height:1.9;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:#414a55!important;-webkit-text-fill-color:#414a55!important;">{{.Body}}</div>
<div class="reply-signature" style="margin-top:28px;font-size:13px;line-height:1.9;color:#68727e!important;-webkit-text-fill-color:#68727e!important;">{{if .AuthorName}}<span style="font-size:14px;font-weight:600;color:#20252b!important;-webkit-text-fill-color:#20252b!important;">{{.AuthorName}}</span><br>{{end}}Deuterium IX 玩家支持</div>
<table class="reply-footer" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:26px;border-top:1px solid #e7ebef;"><tr><td style="padding-top:21px;">
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="50" style="width:50px;"><img src="cid:deuterium-ix-emblem-small-v1" width="36" height="36" alt="Deuterium IX 标志" style="display:block;width:36px;height:36px;border:0;"></td><td style="font-family:Arial,'Microsoft YaHei',sans-serif;font-size:16px;font-weight:700;letter-spacing:.8px;line-height:1.5;color:#20252b!important;-webkit-text-fill-color:#20252b!important;">DEUTERIUM IX</td></tr></table>
<p style="margin:15px 0 0;font-size:11px;line-height:1.9;color:#68727e!important;-webkit-text-fill-color:#68727e!important;">{{if .TicketNumber}}工单 <span style="font-family:Consolas,'Courier New',monospace;">#{{.TicketNumber}}</span><br>{{end}}您可以直接回复本邮件继续沟通。</p>
<p style="margin:7px 0 0;font-size:11px;line-height:1.9;color:#68727e!important;-webkit-text-fill-color:#68727e!important;"><a href="https://help.deuteriumix.com" style="color:#68727e!important;-webkit-text-fill-color:#68727e!important;text-decoration:underline;">帮助中心</a> &nbsp;·&nbsp; <a href="mailto:{{.ReplyAddress}}" style="color:#68727e!important;-webkit-text-fill-color:#68727e!important;text-decoration:underline;">{{.ReplyAddress}}</a></p>
<p style="margin:11px 0 0;font-family:Arial,sans-serif;font-size:10px;line-height:1.8;letter-spacing:.2px;color:#707780!important;-webkit-text-fill-color:#707780!important;">© 2026 DEUTERIUM IX. ALL RIGHTS RESERVED.</p>
</td></tr></table>
</td></tr></table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body>
</html>
