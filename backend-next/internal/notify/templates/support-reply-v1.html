<!doctype html>
<html lang="zh-CN" style="color-scheme:only light;">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light"><meta name="supported-color-schemes" content="light only">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>{{.Subject}}</title>
<style>
:root{color-scheme:only light!important;supported-color-schemes:light only}
body,table,td,a{-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}table,td{mso-table-lspace:0;mso-table-rspace:0}table{border-collapse:collapse}img{border:0;outline:none;-ms-interpolation-mode:bicubic}
@media screen and (max-width:600px){.reply-pad{padding:32px 24px!important}}
</style>
</head>
<body bgcolor="#ffffff" style="margin:0;padding:0;background-color:#ffffff!important;background-image:linear-gradient(#ffffff,#ffffff)!important;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff" style="background-color:#ffffff!important;background-image:linear-gradient(#ffffff,#ffffff)!important;"><tr><td align="center">
<!--[if mso]><table role="presentation" width="600"><tr><td><![endif]-->
<table class="reply-letter" role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:100%;max-width:600px;table-layout:fixed;font-family:'D9 Mail Digits','HarmonyOS Sans SC','HarmonyOS Sans SC Complete','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;"><tr><td class="reply-pad" style="padding:44px 36px 32px;">
<!-- Ticket metadata stays quiet and above the free-form response. -->
{{if .TicketNumber}}<p class="reply-reference" style="margin:0 0 24px;padding-bottom:15px;border-bottom:1px solid #e7ebef;font-size:12px;line-height:1.7;color:#68727e!important;-webkit-text-fill-color:#68727e!important;">工单编号： <span style="font-family:'D9 Mail Digits','Gilroy','HarmonyOS Sans SC','HarmonyOS Sans SC Complete','Microsoft YaHei','Segoe UI',sans-serif;letter-spacing:.3px;">{{.TicketNumber}}</span></p>{{end}}
<div class="reply-body" style="margin:0;font-size:16px;line-height:1.8;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;color:#414a55!important;-webkit-text-fill-color:#414a55!important;">{{.Body}}</div>
<div class="reply-signature" style="margin-top:24px;font-size:14px;line-height:1.8;color:#5f6873!important;-webkit-text-fill-color:#5f6873!important;">{{if .AuthorName}}<span style="font-weight:600;color:#414a55!important;-webkit-text-fill-color:#414a55!important;">{{.AuthorName}}</span><br>{{end}}Deuterium IX 玩家支持</div>
<table class="reply-footer" role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:22px;"><tr><td>
<table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="64" style="width:64px;vertical-align:middle;"><img src="https://xiwanzi.cn-nb2.rains3.com/deuterium-official/mail-assets/v1/deuterium-ix-emblem-b34da374f70be05d.png" width="48" height="48" alt="Deuterium IX 标志" style="display:block;width:48px;height:48px;border:0;"></td><td style="vertical-align:middle;font-family:'D9 Mail Digits','HarmonyOS Sans SC','HarmonyOS Sans SC Complete','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;font-size:13px;font-weight:700;letter-spacing:.6px;line-height:1.5;color:#68727e!important;-webkit-text-fill-color:#68727e!important;"><img src="https://xiwanzi.cn-nb2.rains3.com/deuterium-official/mail-assets/v1/deuterium-ix-wordmark-dark-4bef42e7d6e84f35.png" width="143" height="26" alt="DEUTERIUM IX" style="display:block;width:143px;height:26px;border:0"></td></tr></table>
<p style="margin:11px 0 0;font-size:12px;line-height:1.8;color:#707780!important;-webkit-text-fill-color:#707780!important;">您可以直接回复本邮件继续沟通。</p>
<p style="margin:3px 0 0;font-size:12px;line-height:1.8;color:#707780!important;-webkit-text-fill-color:#707780!important;"><a href="https://help.deuteriumix.com" style="color:#68727e!important;-webkit-text-fill-color:#68727e!important;text-decoration:underline;">帮助中心</a> &nbsp;·&nbsp; <a href="mailto:{{.ReplyAddress}}" style="color:#68727e!important;-webkit-text-fill-color:#68727e!important;text-decoration:underline;">{{.ReplyAddress}}</a></p>
<p style="margin:7px 0 0;font-family:'D9 Mail Digits','HarmonyOS Sans SC','HarmonyOS Sans SC Complete','Microsoft YaHei','PingFang SC','Segoe UI',sans-serif;font-size:11px;line-height:1.8;letter-spacing:.1px;color:#707780!important;-webkit-text-fill-color:#707780!important;">© 2026 DEUTERIUM IX. ALL RIGHTS RESERVED.</p>
</td></tr></table>
</td></tr></table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body>
</html>
