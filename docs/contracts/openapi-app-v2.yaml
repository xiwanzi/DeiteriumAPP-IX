          type: string
          minLength: 1
          maxLength: 128
          description: OSS 返回的请求号，可用于排障，不能作为成功或归属凭证
      required:
      - clientRequestId
      description: 只通知后端开始验证；不接收文件、任意 URL、objectKey、bucket、assetId 或客户端指定 READY。对象位置从 uploadId 的服务端记录读取。
