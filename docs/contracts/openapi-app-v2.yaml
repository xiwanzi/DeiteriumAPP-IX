    OssUploadCreateRequest:
      type: object
      additionalProperties: false
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: 客户端业务幂等键；重试复用，同键不同正文返回冲突
          example: ref_demo_001
        purpose:
          type: string
          enum:
          - AVATAR
          - STORE_MEDIA
          - MARKET_PHOTO
          - COMMISSION_COVER
          - DISPUTE_EVIDENCE
        businessType:
          type: string
          enum:
          - PROFILE
          - MARKET_LISTING
          - COMMISSION
          - ORDER
          - INTERVENTION
          - STORE
        businessRef:
          type: string
          minLength: 1
          maxLength: 128
          description: 已存在业务的引用；证据/商家媒体必填并检查权限，新头像/商品/委托草稿可不填
        fileName:
          type: string
          minLength: 1
          maxLength: 160
          description: 仅展示/诊断，不拼接对象路径
          example: avatar.png
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
          - image/webp
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: 裁切/压缩之后的实际文件字节数
          example: 1819447
        contentMd5:
          type: string
          minLength: 24
          maxLength: 24
          pattern: ^[A-Za-z0-9+/]{22}==$
          description: 同一最终文件的 Base64 MD5，后端将与 OSS 实际校验值比对
          example: 1B2M2Y8AsgTpgAmY7PhCfg==
        altText:
          type: string
          minLength: 0
          maxLength: 200
          description: 替代文字
          example: 玩家头像
      required:
      - clientRequestId
      - purpose
      - businessType
      - fileName
      - contentType
      - sizeBytes
      - contentMd5
      description: 只提交 JSON 元信息，不包含 file/Base64/对象 URL。AVATAR 对应 PROFILE；STORE_MEDIA 对应 STORE 且 businessRef=有权店铺；DISPUTE_EVIDENCE
        必须绑定本人参与的 ORDER/COMMISSION/INTERVENTION。
      example:
        clientRequestId: upload_request_001
        purpose: AVATAR
        businessType: PROFILE
        fileName: avatar.png
        contentType: image/png
        sizeBytes: 1819447
        contentMd5: 1B2M2Y8AsgTpgAmY7PhCfg==
        altText: 玩家头像
    OssPostAuthorization:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - ALIYUN_OSS
        method:
          type: string
          enum:
          - POST
        uploadUrl:
          type: string
          minLength: 1
          maxLength: 4096
          format: uri
          description: 可信 OSS Bucket HTTPS 根地址；客户端向此地址传文件，不向业务 API 传文件
          example: https://deuterium-upload.oss-cn-hangzhou.aliyuncs.com/
        fileFieldName:
          type: string
          enum:
          - file
        formFields:
          type: object
          minProperties: 4
          maxProperties: 24
          additionalProperties:
            type: string
            maxLength: 16384
          description: OSS SDK 签发的完整 POST Policy 表单字段，包含精确 key、policy、签名和必要限制；客户端逐项原样添加，最后添加 file。没有 AccessKeySecret。
        expiresAt:
          type: string
          format: date-time
          description: 上传授权过期时间，默认 5 分钟，且不超过会话期限
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: Policy 限制的精确文件大小，最大 20 MiB
          example: 1819447
      required:
      - provider
      - method
      - uploadUrl
      - fileFieldName
      - formFields
      - expiresAt
      - sizeBytes
      description: 采用 OSS POST Policy 直传，policy 绑定唯一暂存 key、文件精确大小、类型与 private ACL；使用官方 SDK 签名，不自行实现加密算法。
      example:
        provider: ALIYUN_OSS
        method: POST
        uploadUrl: https://deuterium-upload.oss-cn-hangzhou.aliyuncs.com/
        fileFieldName: file
        formFields:
          key: quarantine/upload_demo_001/random.png
          policy: SYNTHETIC_POLICY_NOT_VALID
          x-oss-signature-version: OSS4-HMAC-SHA256
          x-oss-credential: SYNTHETIC_PUBLIC_CREDENTIAL
          x-oss-date: 20260908T020000Z
          x-oss-signature: SYNTHETIC_SIGNATURE_NOT_VALID
          x-oss-object-acl: private
          x-oss-forbid-overwrite: 'true'
          x-oss-content-type: image/png
          success_action_status: '201'
        expiresAt: '2026-09-08T02:05:00Z'
        sizeBytes: 1819447
    OssUploadSession:
      type: object
      additionalProperties: false
      properties:
        uploadId:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端生成的不透明引用
          example: ref_demo_001
        assetId:
          type: string
          minLength: 1
          maxLength: 128
          description: 授权时预分配，只有 READY 后才能用于业务写入
          example: ref_demo_001
        purpose:
          type: string
          enum:
          - AVATAR
          - STORE_MEDIA
          - MARKET_PHOTO
          - COMMISSION_COVER
          - DISPUTE_EVIDENCE
        status:
          type: string
          enum:
          - AUTHORIZED
          - VERIFYING
          - READY
          - REJECTED
          - EXPIRED
        authorization:
          anyOf:
          - $ref: '#/components/schemas/OssPostAuthorization'
          - type: object
            nullable: true
            enum:
            - null
        sessionExpiresAt:
          type: string
          format: date-time
          description: 会话最长 1 小时；续签不无限延长，过期重新申请
        asset:
          anyOf:
          - $ref: '#/components/schemas/AssetView'
          - type: object
            nullable: true
            enum:
            - null
        rejectionCode:
          type: string
          minLength: 1
          maxLength: 80
          nullable: true
          description: 确定失败的业务码；无拒绝时 null
        retryAfterSeconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 30
          description: VERIFYING 时建议查询间隔
          example: 2
      required:
      - uploadId
      - assetId
      - purpose
      - status
      - authorization
      - sessionExpiresAt
      - asset
      - rejectionCode
      - retryAfterSeconds
      description: 仅创建授权的当前账号可读/续签/提交验证。AUTHORIZED 不代表上传完成，OSS 201 不代表 READY；验证成功后仍需调用对应资料/商品/委托接口绑定 assetId。
    OssUploadCompleteRequest:
      type: object
      additionalProperties: false
      properties:
        clientRequestId:
          type: string
