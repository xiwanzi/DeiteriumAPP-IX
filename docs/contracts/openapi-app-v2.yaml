openapi: 3.0.3
info:
  title: DeuteriumAPP 完整业务接口契约
  version: 2.0.3
  license:
    name: Proprietary
  description: 2026-09-09 当前契约。2.0.3 增加账号级记录隐藏及可直接发送公共消息的 HTTP 入口；保留 /api/v1 路径及既有业务模型。旧实施标签按各自历史阶段理解，具体已发布能力以部署记录为准。
servers:
- url: /api/v1
security:
- bearerAuth: []
tags:
- name: Account
  description: 账号与资料
- name: Wallet
  description: 钱包与转账
- name: Chat
  description: 聊天与在线状态
- name: AI
  description: AI 助手
- name: Assets
  description: 媒体上传
- name: Store
  description: 官方商城
- name: Market
  description: 玩家市场
- name: Orders
  description: 订单与退款
- name: Commissions
  description: 委托
- name: Notifications
  description: 通知
- name: App
  description: 应用更新
- name: Merchant
  description: 网页商家端
- name: Admin
  description: 平台管理端
- name: Operations
  description: 资金操作查询
- name: Appearance
  description: 远程外观配置
paths:
  /orders/{orderId}/hide:
    post:
      tags: [Orders]
      summary: 删除本人记录显示
      description: 按账号持久隐藏终态交易或下架/售罄的自有市场商品。保留业务、资金、证据和对方记录；活跃/未知交易不可隐藏，重新活跃后再次显示。
      operationId: hideOrderidV203
      x-implementation-status: implemented_v203
      parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: 已隐藏；同一幂等请求重试保持相同结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HideRecordResponseV203'
        default:
          $ref: '#/components/responses/Error'
  /commissions/{commissionId}/hide:
    post:
      tags: [Commissions]
      summary: 删除本人记录显示
      description: 按账号持久隐藏终态交易或下架/售罄的自有市场商品。保留业务、资金、证据和对方记录；活跃/未知交易不可隐藏，重新活跃后再次显示。
      operationId: hideCommissionidV203
      x-implementation-status: implemented_v203
      parameters:
      - name: commissionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: 已隐藏；同一幂等请求重试保持相同结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HideRecordResponseV203'
        default:
          $ref: '#/components/responses/Error'
  /market/listings/{listingId}/hide:
    post:
      tags: [Market]
      summary: 删除本人记录显示
      description: 按账号持久隐藏终态交易或下架/售罄的自有市场商品。保留业务、资金、证据和对方记录；活跃/未知交易不可隐藏，重新活跃后再次显示。
      operationId: hideListingidV203
      x-implementation-status: implemented_v203
      parameters:
      - name: listingId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MutationRequest'
      responses:
        '200':
          description: 已隐藏；同一幂等请求重试保持相同结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HideRecordResponseV203'
        default:
          $ref: '#/components/responses/Error'
  /app/update-check:
    get:
      tags:
      - App
      summary: 检查当前 App 版本
      description: 兼容已有 latest/latestVersionCode/latestVersionName/message 字段。新增 APK 和资源更新对象；未发布或不兼容的更新为 null。latest
        仅表示 APK 是否最新，hasUpdates 同时覆盖两种更新。无正式服务时客户端必须显示连接失败/本机样例，不能伪造版本。
      security: []
      operationId: checkAppUpdate
      parameters:
      - name: versionCode
        in: query
        required: true
        schema:
          type: integer
          minimum: 0
      - name: versionName
        in: query
        required: false
        schema:
          type: string
      - name: resourceVersion
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 当前已安装资源版本
        description: ''
      - name: packageName
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          description: 目标应用包名；旧客户端不传时默认正式包名
        description: ''
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - stable
          - preview
        description: ''
      responses:
        '200':
          description: 当前版本状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppUpdateCheckResponse'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_route_extension_pending
  /account/registration-code:
    post:
      tags:
      - Account
      summary: 请求注册验证码
      security: []
      operationId: requestRegistrationCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationCodeRequest'
      responses:
        '200':
          description: 验证码已通过服务器私聊发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/register:
    post:
      tags:
      - Account
      summary: 提交注册
      security: []
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功并进入登录态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/login:
    post:
      tags:
      - Account
      summary: 登录
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/password-reset-code:
    post:
      tags:
      - Account
      summary: 请求密码重设验证码
      security: []
      operationId: requestPasswordResetCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCodeRequest'
      responses:
        '200':
          description: 改密验证码已通过服务器私聊发送
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationTokenResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/password-reset:
    post:
      tags:
      - Account
      summary: 提交新密码
      security: []
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 密码已重设
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/logout:
    post:
      tags:
      - Account
      summary: 退出当前设备登录
      operationId: logout
      responses:
        '200':
          description: 当前 token 已失效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /account/me:
    get:
      tags:
      - Account
      summary: 获取当前用户资料
      operationId: getCurrentUser
      responses:
        '200':
          description: 当前用户资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /wallet/balance:
    get:
      tags:
      - Wallet
      summary: 获取当前已知余额
      operationId: getWalletBalance
      responses:
        '200':
          description: 当前已知余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_route_extension_pending
      description: '

        新增 availableAmount、heldAmount、heldBreakdown 和 serverNow。amount 保留为可用余额兼容字段。'
  /wallet/balance/refresh:
    post:
      tags:
      - Wallet
      summary: 刷新信用点余额
      operationId: refreshWalletBalance
      responses:
        '200':
          description: 刷新后的余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalanceResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /wallet/recipients/search:
    get:
      tags:
      - Wallet
      summary: 搜索收款玩家
      operationId: searchRecipients
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RecipientSearchType'
        description: 默认 auto
      responses:
        '200':
          description: 候选收款玩家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientSearchResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /wallet/transfers:
    post:
      tags:
      - Wallet
      summary: 提交信用点转账
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferRequest'
      responses:
        '200':
          description: 转账已处理或进入可查询状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '202':
          description: 转账结果未知或处理中，需要后续查询
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /wallet/transfers/{transferId}:
    get:
      tags:
      - Wallet
      summary: 查询转账结果
      operationId: getTransfer
      parameters:
      - name: transferId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 转账详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /wallet/records:
    get:
      tags:
      - Wallet
      summary: 获取基础信用点流水
      operationId: listWalletRecords
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/AfterRecordId'
      - name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - income
          - expense
        description: ''
      - name: businessType
        in: query
        required: false
        schema:
          type: string
          enum:
          - TRANSFER
          - STORE_PURCHASE
          - MARKET_RESERVE
          - MARKET_SETTLEMENT
          - COMMISSION_RESERVE
          - COMMISSION_SETTLEMENT
          - REFUND
          - ADJUSTMENT
          - AI_PURCHASE
        description: ''
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: UTC 起始时间，含
        description: ''
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: UTC 结束时间，不含
        description: ''
      responses:
        '200':
          description: 基础流水
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRecordsResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_route_extension_pending
      description: '

        新增筛选参数为待实现扩展；时间范围采用 [from,to)，最大跨度建议 366 天。'
  /chat/messages:
    get:
      tags:
      - Chat
      summary: 获取最近公共聊天
      operationId: listChatMessages
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: before
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 公共聊天消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_route_extension_pending
    post:
      tags:
      - Chat
      summary: 发送公共聊天或回复
      description: 2.0.3 已实现；与 chat.send WebSocket 共用鉴权、频控、clientMessageId 去重和回复校验，不等待历史同步或套接字握手。accepted 表示后端已持久接受并排队向在线游戏节点投递，不代表全部节点已经 ACK。
      operationId: postChatMessages
      x-implementation-status: implemented_v203
      x-required-permissions:
      - AUTHENTICATED_PLAYER
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSendResponseV203'
        '400':
          description: 字段或格式错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 登录态无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 资源不存在或不可见
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 版本、幂等或业务状态冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 业务规则不满足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 限流
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 依赖不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatRequest'
      x-error-codes:
      - INVALID_REQUEST
      - UNAUTHORIZED
      - FORBIDDEN
      - NOT_FOUND
      - STATE_VERSION_CONFLICT
      - INVALID_STATE_TRANSITION
      - RATE_LIMITED
      - SERVER_UNAVAILABLE
  /chat/presence:
    get:
      tags:
      - Chat
      summary: 获取服务器在线概览
      operationId: getChatPresence
      responses:
        '200':
          description: 在线人数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresenceResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /chat/online-players:
    get:
      tags:
      - Chat
      summary: 获取服务器在线玩家列表
      operationId: listOnlinePlayers
      responses:
        '200':
          description: 在线玩家列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlinePlayersResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /chat/player-directory:
    get:
      tags:
      - Chat
      summary: 获取玩家目录
      description: 服务器当前在线玩家优先，其后为已注册 App 玩家。
      operationId: listPlayerDirectory
      responses:
        '200':
          description: 玩家目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerDirectoryResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /chat/follows:
    get:
      tags:
      - Chat
      summary: 获取当前账号关心玩家
      operationId: listFollowedPlayers
      responses:
        '200':
          description: 已关心玩家
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowedPlayersResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
    post:
      tags:
      - Chat
      summary: 关心玩家
      operationId: followPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerFollowRequest'
      responses:
        '200':
          description: 关心状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFollowResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /chat/follows/{playerRef}:
    delete:
      tags:
      - Chat
      summary: 取消关心玩家
      operationId: unfollowPlayer
      parameters:
      - name: playerRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 关心状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerFollowResponse'
        '400':
          $ref: '#/components/responses/Error'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /ai/me:
    get:
      tags:
      - AI
      summary: 获取当前 AI 状态
      operationId: getAiMe
      responses:
        '200':
          description: 当前套餐、额度和会话状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiMeResponse'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /ai/plans:
    get:
      tags:
      - AI
      summary: 获取可购买 AI 套餐
      operationId: listAiPlans
      responses:
        '200':
          description: 动态套餐列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiPlansResponse'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /ai/messages:
    get:
      tags:
      - AI
      summary: 获取当前 AI 会话消息
      operationId: listAiMessages
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: before
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 当前会话消息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiMessagesResponse'
        default:
          $ref: '#/components/responses/Error'
      x-implementation-status: existing_v1
  /ai/chat/stream:
    post:
      tags:
      - AI
      summary: 流式发送 AI 消息
      description: '返回 text/event-stream。事件包括 meta、status、sources、delta、done、error； 等待模型或知识库时后端可发送 SSE comment heartbeat（例如
        : keep-alive），客户端必须忽略 comment。 clientMessageId 是 AI 私聊发送幂等键，后端记录 pending/streaming/completed/failed； 重复提交不得重复扣额度，completed
        复放既有回复，pending/streaming 提示稍后刷新。 同一用户同一时间只允许一个 pending/streaming 请求。后端会审计 provider 状态码、首个正文 delta 延迟、总耗时、retry
        次数和是否已发送 delta。


