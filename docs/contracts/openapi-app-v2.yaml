    GlassMaterialConfig:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: 远程材质总许可；false 必须关闭本组；true 仍尊重用户本机关闭开关
          example: true
        blurRadiusDp:
          type: number
          format: float
          minimum: 0
          maximum: 36
          description: 模糊半径 dp
          example: 18
        opacity:
          type: number
          format: float
          minimum: 0.08
          maximum: 1
          description: 表面不透明度，0.08 至 1
          example: 0.42
        refractionStrength:
          type: number
          format: float
          minimum: 0
          maximum: 24
          description: 折射强度，无量纲
          example: 9
        highlightStrength:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 边缘高光强度
          example: 0.65
        dynamicHighlightEnabled:
          type: boolean
          description: 本组是否允许动态追光；仍尊重设备能力和用户减少动态效果
          example: true
        allowLocalTuning:
          type: boolean
          description: true 时用户本组自定义数值优先；false 时远程数值生效，但仍允许本机关闭玻璃
          example: true
      required:
      - enabled
      - blurRadiusDp
      - opacity
      - refractionStrength
      - highlightStrength
      - dynamicHighlightEnabled
      - allowLocalTuning
      description: bottomBarGlass 和 overlayGlass 各保存独立完整对象，禁止共享可变参数或自动复制到另一组。允许值以本文范围为准，NaN/Infinity/未知字段拒绝。
    HeaderGradientConfig:
      type: object
      additionalProperties: false
      properties:
        blurRadiusDp:
          type: number
          format: float
          minimum: 0
          maximum: 36
          description: 顶部渐变模糊半径 dp，独立于两组玻璃
          example: 18
        fadeHeightDp:
          type: number
          format: float
          minimum: 16
          maximum: 96
          description: 顶部渐变扩展参数，对应现有 headerFade；不代表完整工具栏高度
          example: 32
        allowLocalTuning:
          type: boolean
          description: 是否保留用户顶部参数自定义
          example: true
      required:
      - blurRadiusDp
      - fadeHeightDp
      - allowLocalTuning
      description: 独立顶部渐变参数，不从底栏或浮层隐式继承；固定采用平滑渐变算法，不能远程下发 shader/脚本。
    AppearanceSettings:
      type: object
      additionalProperties: false
      properties:
        bottomBarGlass:
          $ref: '#/components/schemas/GlassMaterialConfig'
        overlayGlass:
          $ref: '#/components/schemas/GlassMaterialConfig'
        headerGradient:
          $ref: '#/components/schemas/HeaderGradientConfig'
      required:
      - bottomBarGlass
      - overlayGlass
      - headerGradient
      description: 三组必须完整返回；修改一组不会影响其他组。
    AppearanceOverrides:
      type: object
      additionalProperties: false
      properties:
        bottomBarGlass:
          anyOf:
          - $ref: '#/components/schemas/GlassMaterialConfig'
          - type: object
            nullable: true
            enum:
            - null
        overlayGlass:
          anyOf:
          - $ref: '#/components/schemas/GlassMaterialConfig'
          - type: object
            nullable: true
            enum:
            - null
        headerGradient:
          anyOf:
          - $ref: '#/components/schemas/HeaderGradientConfig'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - bottomBarGlass
      - overlayGlass
      - headerGradient
      description: 管理记录的三组覆盖项；null 表示本范围不覆盖，PLAYER 继承 GLOBAL，GLOBAL 继承内置默认。
    AppearanceSources:
      type: object
      additionalProperties: false
      properties:
        bottomBarGlass:
          type: string
          enum:
          - BUILTIN
          - GLOBAL
          - PLAYER
        overlayGlass:
          type: string
          enum:
          - BUILTIN
          - GLOBAL
          - PLAYER
        headerGradient:
          type: string
          enum:
          - BUILTIN
          - GLOBAL
          - PLAYER
      required:
      - bottomBarGlass
      - overlayGlass
      - headerGradient
      description: ''
    EffectiveAppearance:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          enum:
          - 1
          example: 1
        packageName:
          type: string
          minLength: 1
          maxLength: 200
          description: 已登记的应用包名
          example: com.deuterium.app.uilab
        channel:
          type: string
          enum:
          - stable
          - preview
        globalVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 全局管理记录版本；未建立时为 0
          example: 1
        playerVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 当前玩家管理记录版本；未建立时为 0
          example: 0
        effectiveRevision:
          type: string
          minLength: 1
          maxLength: 200
          description: 服务端生成的版本标识，绑定账号/包名/频道/schema；客户端只作相等比较
          example: appearance_demo_g1_p0_s1
        settings:
          $ref: '#/components/schemas/AppearanceSettings'
        sources:
          $ref: '#/components/schemas/AppearanceSources'
        refreshAfterSeconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 3600
          description: 前台建议拉取间隔，不要求后台常驻
          example: 300
        updatedAt:
          type: string
          format: date-time
          description: 当前合成配置最近变更时间
      required:
      - schemaVersion
      - packageName
      - channel
      - globalVersion
      - playerVersion
      - effectiveRevision
      - settings
      - sources
      - refreshAfterSeconds
      - updatedAt
      description: 只读取当前登录玩家最终配置，不接受 playerRef 替代身份。合成结果不是修改设备成功的回执。
    AppearanceAdminRecord:
      type: object
      additionalProperties: false
      properties:
        scope:
          type: string
          enum:
          - GLOBAL
          - PLAYER
        playerRef:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
            description: PLAYER 时是目标玩家；GLOBAL 时 null
            example: ref_demo_001
          - type: object
            nullable: true
            enum:
            - null
        packageName:
          type: string
          minLength: 1
          maxLength: 200
          description: 包名作用域
          example: com.deuterium.app.uilab
        channel:
          type: string
          enum:
          - stable
          - preview
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 本范围乐观锁版本；首次读取为 0，更新后递增且重置也不归零
          example: 0
        overrides:
          $ref: '#/components/schemas/AppearanceOverrides'
        updatedAt:
          type: string
          format: date-time
          description: 尚未写入时为 null
          nullable: true
      required:
      - scope
      - playerRef
      - packageName
      - channel
      - version
      - overrides
      - updatedAt
      description: 每个 packageName + channel + scope + playerRef 独立一条记录；不存在时 GET 返回 version=0、全 null 覆盖项，便于第一次 PATCH。
    AppearancePatchRequest:
      type: object
      additionalProperties: false
      properties:
        clientRequestId:
          type: string
          minLength: 1
          maxLength: 128
          description: 客户端业务幂等键；重试复用，同键不同正文返回冲突
          example: ref_demo_001
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 目标范围当前 version；首次写入填 0
          example: 0
        reason:
          type: string
          minLength: 2
          maxLength: 500
          description: 配置变更或回退原因，用于管理员审计
          example: 调整浮层模糊，底栏参数保持原值
        bottomBarGlass:
          anyOf:
          - $ref: '#/components/schemas/GlassMaterialConfig'
          - type: object
            nullable: true
            enum:
            - null
        overlayGlass:
          anyOf:
          - $ref: '#/components/schemas/GlassMaterialConfig'
          - type: object
            nullable: true
            enum:
            - null
        headerGradient:
          anyOf:
          - $ref: '#/components/schemas/HeaderGradientConfig'
          - type: object
            nullable: true
            enum:
            - null
      required:
      - clientRequestId
      - expectedVersion
      - reason
      description: 至少提供一组。省略组保持原样；对象必须包含本组所有字段；null 清除本组覆盖并恢复继承。不接受同时修改金额、权限、主题或执行代码。
      minProperties: 4
      example:
        clientRequestId: appearance_patch_001
        expectedVersion: 0
        reason: 仅调整浮层参数，底栏保持原值
        overlayGlass:
          enabled: true
          blurRadiusDp: 24
          opacity: 0.7
          refractionStrength: 4
          highlightStrength: 0.35
          dynamicHighlightEnabled: true
          allowLocalTuning: false
    V2EffectiveAppearanceResponse:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/EffectiveAppearance'
        serverTime:
          type: string
          format: date-time
          description: 服务端当前 UTC 时间
      required:
      - requestId
      - data
      - serverTime
      description: ''
    V2AppearanceAdminRecordResponse:
      type: object
      additionalProperties: false
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
        data:
          $ref: '#/components/schemas/AppearanceAdminRecord'
        serverTime:
          type: string
          format: date-time
          description: 服务端当前 UTC 时间
      required:
      - requestId
      - data
      - serverTime
      description: ''
    AppearanceChangedEvent:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - appearance.updated
        sentAt:
          type: string
          format: date-time
          description: ''
        payload:
          type: object
          additionalProperties: false
          properties:
            eventId:
              type: string
              minLength: 1
              maxLength: 128
              description: 服务端生成的不透明引用
              example: ref_demo_001
            packageName:
              type: string
              minLength: 1
              maxLength: 200
              description: 包名范围
              example: com.deuterium.app.uilab
            channel:
              type: string
              enum:
              - stable
              - preview
            scope:
              type: string
              enum:
              - GLOBAL
              - PLAYER
            recordVersion:
              type: integer
              format: int64
              minimum: 1
              maximum: 2147483647
              description: 发生变化的记录版本
              example: 1
          required:
          - eventId
          - packageName
          - channel
          - scope
          - recordVersion
          description: ''
      required:
      - type
      - sentAt
      - payload
      description: 仅提示重新 GET /app/appearance，不能直接覆盖 UI。GLOBAL 发给该包名/频道受影响的已登录会话，PLAYER 仅目标玩家的匹配会话；不向其他玩家公开目标 ID
        或专属配置。事件丢失靠前台重新拉取恢复。
    ResourceChangedPayload:
      type: object
      additionalProperties: false
      properties:
        eventId:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端生成的不透明引用
          example: ref_demo_001
        resourceId:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端生成的不透明引用
          example: ref_demo_001
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 乐观锁版本。修改必须提交最近读取的版本
          example: 1
        occurredAt:
          type: string
          format: date-time
          description: ''
        status:
          type: string
          minLength: 1
          maxLength: 80
          description: 对应订单或委托状态
      required:
      - eventId
