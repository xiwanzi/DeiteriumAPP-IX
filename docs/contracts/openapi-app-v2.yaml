      description: 至少修改 bio 或 avatarAssetId 一项；不支持用该接口修改 QQ、游戏身份或权限。
      minProperties: 3
    AssetView:
      type: object
      additionalProperties: false
      properties:
        assetId:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端生成的不透明引用
          example: ref_demo_001
        purpose:
          type: string
          enum:
          - AVATAR
          - STORE_MEDIA
          - MARKET_PHOTO
          - COMMISSION_COVER
          - DISPUTE_EVIDENCE
        status:
          type: string
          enum:
          - PROCESSING
          - READY
          - REJECTED
        url:
          type: string
          minLength: 1
          maxLength: 4096
          format: uri
          description: 服务端提供的 HTTPS 图片地址；私密证据使用短期授权 URL
          example: https://cdn.example.invalid/assets/cover.png
          nullable: true
        width:
          type: integer
          format: int64
          minimum: 1
          maximum: 8192
          description: 像素宽
          example: 1254
          nullable: true
        height:
          type: integer
          format: int64
          minimum: 1
          maximum: 8192
          description: 像素高
          example: 1254
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 20971520
          description: 文件字节数
          example: 1819447
        sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-fA-F0-9]{64}$
          description: 可信云端处理实际计算的 SHA-256；未计算时 null，禁止把客户端声明/自定义 OSS 元数据冒充服务端校验摘要。
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          nullable: true
        altText:
          type: string
          minLength: 0
          maxLength: 200
          description: 替代文字
        createdAt:
          type: string
          format: date-time
          description: ''
        contentMd5:
          type: string
          minLength: 24
          maxLength: 24
          nullable: true
          pattern: ^[A-Za-z0-9+/]{22}==$
          description: 由后端读取 OSS 实际对象元数据取得的 Base64 MD5；尚未验证时 null。只作传输完整性校验，不授予资源权限。
          example: 1B2M2Y8AsgTpgAmY7PhCfg==
        urlExpiresAt:
          type: string
          format: date-time
          description: 私有签名下载地址到期时间；无 URL 或公开 CDN 地址时 null
          nullable: true
      required:
      - assetId
      - purpose
      - status
      - url
      - width
      - height
      - sizeBytes
      - sha256
      - altText
      - createdAt
      - contentMd5
      - urlExpiresAt
      description: READY 仅由后端核验真实 OSS 对象后设置。业务只存 assetId，不能存临时上传 URL、客户端 objectKey 或自报下载 URL。
      example: *id005
