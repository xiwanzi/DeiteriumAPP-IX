    AppRelease:
      type: object
      additionalProperties: false
      properties:
        releaseId:
          type: string
          minLength: 1
          maxLength: 128
          description: 服务端生成的不透明引用
          example: ref_demo_001
        kind:
          type: string
          enum:
          - APK
          - RESOURCES
        versionName:
          type: string
          minLength: 1
          maxLength: 80
          description: 用户可读的版本名称
          example: 1.0.6
        versionCode:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: APK 版本号，资源包可为 0
          example: 8
        resourceVersion:
          type: integer
          format: int64
          minimum: 0
          maximum: 2147483647
          description: 资源版本号，APK 可为 0
          example: 0
        packageName:
          type: string
          minLength: 1
          maxLength: 200
          description: 目标 Android 包名；客户端仍核对实际 APK
          example: com.deuterium.app
        releaseNotes:
          type: string
          minLength: 1
          maxLength: 10000
          description: 纯文本更新说明
        downloadUrl:
          type: string
          minLength: 1
          maxLength: 4096
          format: uri
          description: HTTPS 文件地址，不使用 bearer token；可使用短期签名 URL
          example: https://cdn.example.invalid/releases/app-8.apk
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 209715200
          description: 文件大小，APK ≤200 MiB，资源包 ≤20 MiB
          example: 30000000
        sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: ^[a-fA-F0-9]{64}$
          description: 整个文件 SHA-256
          example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        minAppVersionCode:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 资源包兼容范围下界
          example: 7
        maxAppVersionCode:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 资源包兼容范围上界
          example: 99
        publishedAt:
          type: string
          format: date-time
          description: ''
        channel:
          type: string
          enum:
          - stable
          - preview
      required:
      - releaseId
      - kind
      - versionName
      - versionCode
      - resourceVersion
      - packageName
      - releaseNotes
      - downloadUrl
      - sizeBytes
      - sha256
      - minAppVersionCode
      - maxAppVersionCode
      - publishedAt
      - channel
      description: AP​​K versionCode 必须大于当前版本且与包内版本一致；资源版本必须递增且兼容当前 APK。资源更新不加载代码。
      example: *id017
    ResourceManifest:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 1
          description: 当前仅 1
          example: 1
        resourceVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 资源版本
          example: 2
        minAppVersionCode:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 最低 APK 版本
          example: 7
        maxAppVersionCode:
          type: integer
          format: int64
          minimum: 1
          maximum: 2147483647
          description: 最高 APK 版本
          example: 99
        entries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
                minLength: 1
                maxLength: 180
                description: 包内相对路径；不能有 ..、绝对路径、反斜线或冒号
                example: strings.json
              sizeBytes:
                type: integer
                format: int64
                minimum: 1
                maximum: 104857600
                description: 解压后的大小
                example: 300
              sha256:
                type: string
                minLength: 64
                maxLength: 64
                description: 单文件摘要
                example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            required:
            - path
            - sizeBytes
            - sha256
            description: ''
          minItems: 1
          maxItems: 500
          description: ''
      required:
      - schemaVersion
      - resourceVersion
      - minAppVersionCode
      - maxAppVersionCode
      - entries
      description: ZIP 根目录 manifest.json ≤64 KiB。仅 JSON/PNG/JPEG/WebP，总解压量≤100 MiB，禁止额外文件和重复路径。
