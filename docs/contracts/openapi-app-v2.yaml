components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    AfterRecordId:
      name: afterRecordId
      in: query
      required: false
      description: 传入后只返回该流水之后的新流水，供离线增量同步使用。
      schema:
        type: string
  responses:
    Error:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HideRecordResponseV203:
      type: object
      additionalProperties: false
      required: [requestId, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: false
          required: [hidden]
          properties:
            hidden:
              type: boolean
    PublicSendResponseV203:
      type: object
      additionalProperties: false
      required: [requestId, data]
      properties:
        requestId:
          type: string
        serverTime:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: false
          required: [clientMessageId, status]
          properties:
            clientMessageId:
              type: string
            status:
              type: string
              enum: [accepted, failed, unknown]
            messageId:
              type: string
            message:
              $ref: '#/components/schemas/ChatMessage'
            error:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
    RequestId:
      type: string
      example: req_01HV0000000000000000000000
    ApiResponseBase:
      type: object
      required:
      - requestId
      properties:
        requestId:
          $ref: '#/components/schemas/RequestId'
    AppUpdateCheckData:
      type: object
      required:
      - latest
      - message
      - latestVersionCode
      - latestVersionName
      properties:
        latest:
          type: boolean
        message:
          type: string
          minLength: 1
          maxLength: 200
          description: 人类可读状态；不可据此判断版本
        latestVersionCode:
          type: integer
        latestVersionName:
          type: string
        serverNow:
          type: string
          format: date-time
          description: ''
        hasUpdates:
          type: boolean
          description: ''
          example: true
        apkUpdate:
          anyOf:
          - $ref: '#/components/schemas/AppRelease'
          - type: object
            nullable: true
            enum:
            - null
        resourceUpdate:
          anyOf:
          - $ref: '#/components/schemas/AppRelease'
          - type: object
            nullable: true
            enum:
            - null
      example:
        latest: false
        message: 有更新可用
        latestVersionCode: 8
        latestVersionName: 1.0.6
        serverNow: '2026-09-08T02:00:00Z'
        hasUpdates: true
        apkUpdate: &id017
          releaseId: release_apk_8
          kind: APK
          versionName: 1.0.6
          versionCode: 8
          resourceVersion: 0
          packageName: com.deuterium.app
          releaseNotes: 优化委托履约与交易通知体验。
          downloadUrl: https://cdn.example.invalid/releases/deuterium-1.0.6.apk
          sizeBytes: 30000000
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          minAppVersionCode: 7
          maxAppVersionCode: 99
          publishedAt: '2026-09-08T02:00:00Z'
          channel: stable
        resourceUpdate:
          releaseId: release_resources_2
          kind: RESOURCES
          versionName: 资源版本 2
          versionCode: 0
          resourceVersion: 2
          packageName: com.deuterium.app
          releaseNotes: 更新大厅文案和品牌图片。
